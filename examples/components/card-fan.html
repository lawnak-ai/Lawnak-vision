<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card fan · component</title>
<link rel="stylesheet" href="_preview/preview.css">
</head>
<body>
<section class="slide active" dir="auto">
<!-- COMPONENT card-fan: copy from here -->
<style>
/* Card fan: three cards start as one stack and fan out, then drift gently.
   Hovering a card lifts it to the front. Set each card's place with --cx-x (sideways)
   and --cx-r (turn). The layout is symmetric, so it needs no change for right-to-left slides. */
.cx-cf-wrap{flex:1;display:grid;grid-template-columns:1fr 1.45fr;align-items:center;gap:32px}
.cx-cf-text{display:flex;flex-direction:column;gap:20px}
.cx-cf-text p{color:var(--muted)}
.cx-cf{position:relative;height:420px}
.cx-cf-card{position:absolute;left:50%;top:50%;width:210px;height:300px;margin:-150px 0 0 -105px;
  display:flex;flex-direction:column;justify-content:space-between;padding:24px;border-radius:24px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,var(--bg-solid)),var(--bg-solid) 70%);
  border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));
  box-shadow:0 30px 60px -25px rgba(0,0,0,.55);
  transform:translateX(var(--cx-x,0)) rotate(var(--cx-r,0deg));z-index:var(--cx-z,1);
  transition:scale .35s var(--lv-ease),box-shadow .35s}
.cx-cf-card:hover{scale:1.06;z-index:5;box-shadow:0 40px 80px -25px color-mix(in srgb,var(--accent) 60%,transparent)}
.cx-cf-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;
  background:color-mix(in srgb,var(--accent) 22%,transparent)}
.cx-cf-card h3{font-size:28px}
.cx-cf-card p{font-size:19px;line-height:1.35;color:var(--muted);margin-top:8px}

/* Motion: the fan opens from a stack, then each card floats on its own beat (a separate property, so it never fights the fan) */
.slide:is(.active,.lv-leave) .cx-cf-text>*{animation:cx-cf-up .8s var(--lv-ease) both;animation-delay:calc(.1s + var(--cx-i,0) * .12s)}
.slide:is(.active,.lv-leave) .cx-cf-card{animation:cx-cf-open 1.1s var(--lv-ease) both,cx-cf-float 5s ease-in-out infinite;
  animation-delay:calc(.35s + var(--cx-i,0) * .08s),calc(1.6s + var(--cx-i,0) * .7s)}
@keyframes cx-cf-open{0%{opacity:0;transform:translate(0,90px) rotate(0deg) scale(.85)}35%{opacity:1;transform:translate(0,0) rotate(0deg)}}
@keyframes cx-cf-float{50%{translate:0 -12px}}
@keyframes cx-cf-up{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){.cx-cf-wrap *{animation:none!important}}
</style>
<div class="cx-cf-wrap">
  <div class="cx-cf-text">
    <h2 style="--cx-i:0">Three plans, one platform</h2>
    <p style="--cx-i:1">Start free, grow when you need to. Every plan includes the AI designer.</p>
  </div>
  <div class="cx-cf">
    <div class="cx-cf-card" style="--cx-i:0;--cx-x:-212px;--cx-r:-8deg">
      <span class="cx-cf-icon">🌱</span><div><h3>Starter</h3><p>5 decks a month, all themes</p></div>
    </div>
    <div class="cx-cf-card" style="--cx-i:2;--cx-x:212px;--cx-r:8deg">
      <span class="cx-cf-icon">🏢</span><div><h3>Team</h3><p>Shared templates and brand kit</p></div>
    </div>
    <div class="cx-cf-card" style="--cx-i:1;--cx-z:2">
      <span class="cx-cf-icon">⚡</span><div><h3>Pro</h3><p>Unlimited decks, video export</p></div>
    </div>
  </div>
</div>
<!-- /COMPONENT card-fan -->
</section>
<script src="_preview/preview.js"></script>
</body>
</html>
