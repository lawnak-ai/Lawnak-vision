appId: ai.lawnak.vision
productName: Lawnak Vision
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
icon: resources/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: LawnakVision-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lawnak Vision
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
