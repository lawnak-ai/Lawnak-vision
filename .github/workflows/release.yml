name: Build and release

# Three ways to run this:
# - Actions tab -> "Build and release" -> Run workflow, with a version such as
#   0.2.0: builds the Windows installer, creates the tag v0.2.0 and publishes
#   the GitHub Release. Leave the version empty to only build.
# - Push a tag such as v0.2.0: same as above, using the pushed tag.
# - Pull requests: build only, so problems show up before a release.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (leave empty to only build)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Work out the release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
          fi
          v="$(echo "$v" | tr -d '[:space:]')"
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ -n "$v" ]]; then echo "Releasing v$v"; else echo "Build only, no release"; fi

      # Stops before building if this version was already released, so a
      # second run can't replace the installer or repeat the release notes.
      # A release created on GitHub's website (no installer yet) still gets one.
      - name: Check for an existing release
        id: existing
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists. Run the workflow again with a new version."
            exit 1
          fi
          if assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2> /dev/null)"; then
            if grep -qE '^LawnakVision-Setup-.*\.exe$' <<< "$assets"; then
              echo "::error::Release $tag already has an installer. Use a new version, or delete that release first."
              exit 1
            fi
            echo "Release $tag exists without an installer; it will be attached."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Set the app version
        if: steps.version.outputs.version != ''
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LawnakVision-windows
          path: release/LawnakVision-Setup-*.exe
          if-no-files-found: error

      # Creates the tag on this commit if it doesn't exist yet.
      - name: Publish GitHub Release
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lawnak Vision ${{ steps.version.outputs.version }}
          files: |
            release/LawnakVision-Setup-*.exe
            release/LawnakVision-Setup-*.exe.blockmap
          # Only for a new release; on an existing one this would append a second copy.
          generate_release_notes: ${{ steps.existing.outputs.exists != 'true' }}
          fail_on_unmatched_files: true
