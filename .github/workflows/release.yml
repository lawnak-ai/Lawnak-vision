name: Build and release

# Push a tag like v0.2.0 to build the Windows installer and publish it as a
# GitHub Release. Pull requests get the same build (without a release) so
# problems show up before tagging.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LawnakVision-windows
          path: release/LawnakVision-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LawnakVision-Setup-*.exe
            release/LawnakVision-Setup-*.exe.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
